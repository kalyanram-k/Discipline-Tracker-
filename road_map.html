<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discipline | Roadmaps</title>

  <style>
    :root {
      --bg: #0f1115;
      --card: #161a20;
      --border: #222;
      --text: #eaeaea;
      --muted: #a1a1a1;
      --accent: #3a86ff;
      --danger: #ff4d4d;
    }

    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      padding: 30px;
    }

    header {
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2rem;
    }

    header p {
      color: var(--muted);
      margin-top: 6px;
    }

    .section {
      background: var(--card);
      padding: 22px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 30px;
    }

    h2 {
      color: var(--accent);
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 0.9rem;
    }

    input, textarea, select {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid #333;
      border-radius: 8px;
    }

    textarea {
      resize: vertical;
    }

    button {
      margin-top: 18px;
      padding: 10px 18px;
      background: var(--accent);
      border: none;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ---------- ROADMAP ---------- */
    .roadmap {
      position: relative;
      padding-left: 40px;
    }

    .roadmap::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(var(--accent), transparent);
      border-radius: 2px;
    }

    .milestone {
      position: relative;
      margin-bottom: 35px;
      padding: 18px 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: grab;
    }

    .milestone.dragging {
      opacity: 0.4;
    }

    .milestone::before {
      content: "";
      position: absolute;
      left: -33px;
      top: 24px;
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(58,134,255,0.6);
    }

    .milestone h3 {
      margin-bottom: 6px;
    }

    .meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .edit {
      margin-left: 8px;
      cursor: pointer;
      color: var(--accent);
    }

    .delete {
      position: absolute;
      top: 18px;
      right: 18px;
      color: var(--danger);
      cursor: pointer;
      font-size: 0.85rem;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #555;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <h1>🗺️ Roadmaps</h1>
  <p>Drag your goals. Adjust timelines. Own the journey.</p>
</header>

<!-- ADD GOAL -->
<div class="section">
  <h2>🎯 Add Milestone</h2>

  <label>Goal Title</label>
  <input id="title" placeholder="Become a Full Stack Developer">

  <label>Category</label>
  <select id="category">
    <option>Career</option>
    <option>Health</option>
    <option>Finance</option>
    <option>Skills</option>
    <option>Mindset</option>
  </select>

  <label>Target Date</label>
  <input type="date" id="targetDate">

  <label>Description</label>
  <textarea id="description" rows="3"></textarea>

  <button onclick="addGoal()">Add to Roadmap</button>
</div>

<!-- ROADMAP -->
<div class="section">
  <h2>🛣️ Your Journey</h2>
  <div class="roadmap" id="roadmap"></div>
</div>

<footer>
  Discipline • Roadmaps • Flexible by design<br>
  <a href="index.html">← Back to Dashboard</a>
</footer>

<script>
let draggedId = null;

function getGoals() {
  return JSON.parse(localStorage.getItem("roadmapGoals")) || [];
}

function saveGoals(goals) {
  localStorage.setItem("roadmapGoals", JSON.stringify(goals));
}

function addGoal() {
  if (!title.value || !targetDate.value) return alert("Title & date required");

  const goals = getGoals();
  goals.push({
    id: Date.now(),
    title: title.value,
    category: category.value,
    targetDate: targetDate.value,
    description: description.value
  });

  saveGoals(goals);
  title.value = description.value = targetDate.value = "";
  render();
}

function deleteGoal(id) {
  saveGoals(getGoals().filter(g => g.id !== id));
  render();
}

function editDate(id) {
  const newDate = prompt("Enter new target date (YYYY-MM-DD)");
  if (!newDate) return;

  const goals = getGoals();
  const g = goals.find(x => x.id === id);
  if (g) g.targetDate = newDate;

  saveGoals(goals);
  render();
}

function dragStart(e, id) {
  draggedId = id;
  e.target.classList.add("dragging");
}

function dragEnd(e) {
  e.target.classList.remove("dragging");
}

function drop(e, id) {
  e.preventDefault();
  const goals = getGoals();
  const from = goals.findIndex(g => g.id === draggedId);
  const to = goals.findIndex(g => g.id === id);
  goals.splice(to, 0, goals.splice(from, 1)[0]);
  saveGoals(goals);
  render();
}

function render() {
  const roadmap = document.getElementById("roadmap");
  roadmap.innerHTML = "";

  getGoals().forEach(g => {
    roadmap.innerHTML += `
      <div class="milestone"
        draggable="true"
        ondragstart="dragStart(event, ${g.id})"
        ondragend="dragEnd(event)"
        ondragover="event.preventDefault()"
        ondrop="drop(event, ${g.id})">
        
        <span class="delete" onclick="deleteGoal(${g.id})">Delete</span>
        <h3>${g.title}</h3>
        <div class="meta">
          ${g.category} • ${g.targetDate}
          <span class="edit" onclick="editDate(${g.id})">✏️</span>
        </div><br>
        ${g.description || ""}
      </div>
    `;
  });
}

render();
</script>

</body>
</html>
